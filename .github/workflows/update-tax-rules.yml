name: Update Tax Rules (Annual)

on:
  schedule:
    - cron: "0 6 15 1 *"   # Jan 15 at 06:00 UTC every year
  workflow_dispatch:         # Allow manual trigger from GitHub UI
    inputs:
      country:
        description: "Country code to update (leave blank for all)"
        required: false
        default: ""
      no_search:
        description: "Skip SerpAPI, use OpenAI knowledge only (true/false)"
        required: false
        default: "false"

jobs:
  update-tax:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests

      - name: Run tax rules updater
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_BACKUP: ${{ secrets.OPENAI_API_KEY_BACKUP }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_API_KEY_BACKUP: ${{ secrets.CLAUDE_API_KEY_BACKUP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER_PRIORITY: ${{ secrets.LLM_PROVIDER_PRIORITY || 'claude,openai,gemini' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.country }}" ]; then
            ARGS="$ARGS --country ${{ github.event.inputs.country }}"
          fi
          if [ "${{ github.event.inputs.no_search }}" = "true" ]; then
            ARGS="$ARGS --no-search"
          fi
          python scripts/update_tax_rules.py $ARGS

      - name: Check if draft was generated
        id: check_draft
        run: |
          if [ -f "lib/tax-rules.draft.json" ]; then
            echo "draft_exists=true" >> $GITHUB_OUTPUT
          else
            echo "draft_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply draft automatically
        if: steps.check_draft.outputs.draft_exists == 'true'
        run: python scripts/update_tax_rules.py --apply

      - name: Build Next.js to verify no errors
        if: steps.check_draft.outputs.draft_exists == 'true'
        run: |
          npm ci
          npm run build

      - name: Create Pull Request for review
        if: steps.check_draft.outputs.draft_exists == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "auto/tax-rules-update"
          title: "🧾 Annual Tax Rules Update — $(date +'%Y')"
          body: |
            ## Annual Tax Data Update

            This PR was automatically generated by the `update-tax-rules` GitHub Action.

            ### ⚠️ IMPORTANT: Human Review Required

            **Please verify the updated brackets before merging:**

            | Country | Official Source |
            |---------|----------------|
            | 🇺🇸 USA | [IRS Tax Rate Schedules](https://www.irs.gov/newsroom/irs-releases-tax-inflation-adjustments) |
            | 🇬🇧 UK | [HMRC Income Tax Rates](https://www.gov.uk/income-tax-rates) |
            | 🇨🇦 Canada | [CRA Federal Tax Rates](https://www.canada.ca/en/revenue-agency/services/tax/individuals/frequently-asked-questions-individuals/canadian-income-tax-rates-individuals-current-previous-years.html) |
            | 🇦🇺 Australia | [ATO Tax Rates](https://www.ato.gov.au/tax-rates-and-codes/tax-rates-australian-residents) |
            | 🇩🇪 Germany | [Bundesfinanzministerium](https://www.bundesfinanzministerium.de) |
            | 🇸🇬 Singapore | [IRAS Tax Rates](https://www.iras.gov.sg/taxes/individual-income-tax/basics-of-individual-income-tax/tax-residency-and-tax-rates/individual-income-tax-rates) |
            | 🇫🇷 France | [Impots.gouv.fr](https://www.impots.gouv.fr) |
            | 🇯🇵 Japan | [NTA Japan](https://www.nta.go.jp/english/) |

            ### Files changed
            - `lib/tax-rules.json` — updated tax brackets and `_meta.lastUpdated`

            ### After merging
            Netlify will automatically rebuild and deploy the site. The disclaimer on the tax calculator will update to show the new data date.

            ---
            *Generated by `update_tax_rules.py` (AI-assisted). Always verify numbers against official sources.*
          commit-message: "chore: annual tax rules update"
          delete-branch: true
          labels: "tax-update,automated"
