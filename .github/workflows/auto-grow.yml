name: Auto-Grow Tools (Weekly)

on:
  schedule:
    - cron: "0 2 * * 1"   # Every Monday at 02:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI
    inputs:
      category:
        description: "Tool category to grow (e.g. finance, health, math)"
        required: false
        default: "finance"
      count:
        description: "Number of new tools to generate"
        required: false
        default: "3"

jobs:
  grow:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install openai requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run research (SerpAPI)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          CATEGORY="${{ github.event.inputs.category || 'finance' }}"
          python scripts/research.py --category "$CATEGORY"

      - name: Generate new tool ideas (OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          CATEGORY="${{ github.event.inputs.category || 'finance' }}"
          COUNT="${{ github.event.inputs.count || '3' }}"
          python scripts/ai_generate.py --category "$CATEGORY" --count "$COUNT"

      - name: Generate tool files
        run: python scripts/generate_tool.py

      - name: Build Next.js site
        run: npm run build

      - name: Commit and push new tools
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No new tools generated — nothing to commit."
          else
            CATEGORY="${{ github.event.inputs.category || 'finance' }}"
            COUNT=$(git diff --cached --name-only | grep "tools-registry" | grep "meta.json" | wc -l | tr -d ' ')
            git commit -m "feat(auto-grow): +${COUNT} new ${CATEGORY} tools [skip ci]"
            git push
          fi
