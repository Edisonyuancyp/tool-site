name: Auto-Grow Tools (Daily Updates)

on:
  schedule:
    - cron: "0 2 * * *"   # Every day at 02:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI
    inputs:
      mode:
        description: "Manual mode: new-tool | content | seo-geo | keywords | maintenance"
        required: false
        default: ""
      category:
        description: "Category for new-tool mode (ecommerce | quant | design | ... )"
        required: false
        default: ""
      count:
        description: "Number of tools to generate"
        required: false
        default: "5"

jobs:
  grow:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install openai requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      # ── Pick run mode based on schedule or manual input ────────────────────
      - name: Determine run mode
        id: vars
        run: |
          # Manual override always wins
          if [ "${{ github.event.inputs.mode }}" != "" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "CATEGORY=${{ github.event.inputs.category }}" >> "$GITHUB_OUTPUT"
            echo "Run mode: manual / mode=${{ github.event.inputs.mode }}"
            exit 0
          fi

          # Scheduled weekday mapping
          DAY=$(date -u +%u)
          case "$DAY" in
            1) MODE=new-tool;   CATEGORY=ecommerce ;;
            2) MODE=content;    CATEGORY= ;;
            3) MODE=new-tool;   CATEGORY=quant ;;
            4) MODE=seo-geo;    CATEGORY= ;;
            5) MODE=new-tool;   CATEGORY=design ;;
            6) MODE=keywords;   CATEGORY= ;;
            7) MODE=maintenance; CATEGORY= ;;
            *) MODE=maintenance; CATEGORY= ;;
          esac
          echo "MODE=$MODE"         >> "$GITHUB_OUTPUT"
          echo "CATEGORY=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "Run mode: scheduled / weekday=$DAY / mode=$MODE"

      # ── Mode: new-tool ──────────────────────────────────────────────────────
      - name: Research + Generate new tool
        if: ${{ steps.vars.outputs.MODE == 'new-tool' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          CATEGORY="${{ steps.vars.outputs.CATEGORY }}"
          COUNT="${{ github.event.inputs.count || '5' }}"
          echo "Generating $COUNT tool(s) for category: $CATEGORY"
          python scripts/research.py --category "$CATEGORY"
          python scripts/ai_generate.py --category "$CATEGORY" --count "$COUNT"

      - name: Generate registry files for new tools
        if: ${{ steps.vars.outputs.MODE == 'new-tool' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_tool.py

      - name: Write Claude tutorials for new tools
        if: ${{ steps.vars.outputs.MODE == 'new-tool' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python scripts/write-tool-guide.py --delay 1.5

      - name: Translate new tools (zh/ja/de/pt)
        if: ${{ steps.vars.outputs.MODE == 'new-tool' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          for LOCALE in zh ja de pt; do
            echo "Translating → $LOCALE"
            node scripts/ai-translate.mjs --locale "$LOCALE" --all
          done

      # ── Mode: content refresh (Tuesdays) ───────────────────────────────────
      - name: Refresh existing tool tutorials
        if: ${{ steps.vars.outputs.MODE == 'content' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python scripts/refresh-content.py --limit 5 --delay 1.2

      # ── Mode: SEO/GEO refresh (Thursdays) ──────────────────────────────────
      - name: Regenerate llms.txt for AI crawlers
        if: ${{ steps.vars.outputs.MODE == 'seo-geo' }}
        run: python scripts/refresh-llms-txt.py

      # ── Mode: keywords (Saturdays) ────────────────────────────────────────
      - name: Refresh Google Suggest keywords
        if: ${{ steps.vars.outputs.MODE == 'keywords' }}
        run: python scripts/refresh-keywords.py --limit 20 --delay 0.5

      # ── Mode: maintenance (Sundays) ───────────────────────────────────────
      - name: Weekly maintenance pass
        if: ${{ steps.vars.outputs.MODE == 'maintenance' }}
        run: python scripts/maintenance.py

      - name: Generate variants for tools missing them
        if: ${{ steps.vars.outputs.MODE == 'maintenance' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python scripts/generate-variants.py --limit 20

      - name: Generate programmatic SEO pages
        if: ${{ steps.vars.outputs.MODE == 'maintenance' }}
        run: python scripts/generate-programmatic-seo.py

      # ── Shared: audit + auto-fix + build + commit ──────────────────────────
      - name: Audit all tools (self-check)
        run: node scripts/audit-tools.mjs || true

      - name: Auto-fix broken tool views
        run: node scripts/fix-broken-tools.mjs

      - name: Build Next.js site
        run: npm run build

      - name: Commit and push daily update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ No changes — nothing to commit."
          else
            COUNT=$(git diff --cached --name-only | grep "tools-registry" | grep "meta.json" | wc -l | tr -d ' ')
            git commit -m "feat(auto-grow): daily update [mode=${{ steps.vars.outputs.MODE }}] +${COUNT} files [skip ci]"
            git push
          fi
