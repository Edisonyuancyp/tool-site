name: Auto-Grow Tools (Daily Updates)

on:
  schedule:
    - cron: "0 2 * * *"   # Every day at 02:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI
    inputs:
      mode:
        description: "Manual mode: new-tool | content | seo-geo | keywords | maintenance | deep-review"
        required: false
        default: ""
      category:
        description: "Category for new-tool mode (ai | seo | social | image | file | ecommerce | quant | design | dev | youtube | amazon | pinterest)"
        required: false
        default: ""
      count:
        description: "Number of tools to generate"
        required: false
        default: "5"

jobs:
  grow:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install openai requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      # ── Pick run mode based on schedule or manual input ────────────────────
      - name: Determine run mode
        id: vars
        run: |
          # Manual override always wins
          if [ "${{ github.event.inputs.mode }}" != "" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "CATEGORY=${{ github.event.inputs.category }}" >> "$GITHUB_OUTPUT"
            echo "Run mode: manual / mode=${{ github.event.inputs.mode }}"
            exit 0
          fi

          # Scheduled weekday mapping (see EVOLUTION_PLAN.md)
          DAY=$(date -u +%u)
          case "$DAY" in
            1) MODE=new-tool;   CATEGORY=ai ;;          # Monday: AI tools (highest ROI)
            2) MODE=content;    CATEGORY= ;;             # Tuesday: problem+tool content
            3) MODE=new-tool;   CATEGORY=seo ;;           # Wednesday: SEO tools
            4) MODE=seo-geo;    CATEGORY= ;;             # Thursday: SEO/GEO refresh
            5) MODE=new-tool;   CATEGORY=dev ;;           # Friday: developer/ecom/social rotate
            6) MODE=keywords;   CATEGORY= ;;             # Saturday: keyword & variant refresh
            7) MODE=maintenance; CATEGORY= ;;            # Sunday: maintenance + deep review
            *) MODE=maintenance; CATEGORY= ;;
          esac
          echo "MODE=$MODE"         >> "$GITHUB_OUTPUT"
          echo "CATEGORY=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "Run mode: scheduled / weekday=$DAY / mode=$MODE"

      # ── Mode: new-tool ──────────────────────────────────────────────────────
      - name: Research + Generate new tool
        if: ${{ steps.vars.outputs.MODE == 'new-tool' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_BACKUP: ${{ secrets.OPENAI_API_KEY_BACKUP }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_API_KEY_BACKUP: ${{ secrets.CLAUDE_API_KEY_BACKUP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER_PRIORITY: ${{ secrets.LLM_PROVIDER_PRIORITY || 'claude,openai,gemini' }}
        run: |
          CATEGORY="${{ steps.vars.outputs.CATEGORY }}"
          COUNT="${{ github.event.inputs.count || '5' }}"
          echo "Generating $COUNT tool(s) for category: $CATEGORY"
          python scripts/research.py --category "$CATEGORY" || echo "⚠️ research.py failed, continuing"
          python scripts/ai_generate.py --category "$CATEGORY" --count "$COUNT" || echo "⚠️ ai_generate.py failed, continuing"

      - name: Generate registry files for new tools
        if: ${{ steps.vars.outputs.MODE == 'new-tool' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_BACKUP: ${{ secrets.OPENAI_API_KEY_BACKUP }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_API_KEY_BACKUP: ${{ secrets.CLAUDE_API_KEY_BACKUP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER_PRIORITY: ${{ secrets.LLM_PROVIDER_PRIORITY || 'claude,openai,gemini' }}
        run: python scripts/generate_tool.py || echo "⚠️ generate_tool.py failed, continuing"

      - name: Write LLM tutorials for new tools
        if: ${{ steps.vars.outputs.MODE == 'new-tool' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_API_KEY_BACKUP: ${{ secrets.CLAUDE_API_KEY_BACKUP }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_BACKUP: ${{ secrets.OPENAI_API_KEY_BACKUP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER_PRIORITY: ${{ secrets.LLM_PROVIDER_PRIORITY || 'claude,openai,gemini' }}
        run: python scripts/write-tool-guide.py --delay 1.5 || echo "⚠️ write-tool-guide.py failed, continuing"

      - name: Translate new tools (zh/ja/de/pt)
        if: ${{ steps.vars.outputs.MODE == 'new-tool' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_API_KEY_BACKUP: ${{ secrets.CLAUDE_API_KEY_BACKUP }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_BACKUP: ${{ secrets.OPENAI_API_KEY_BACKUP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for LOCALE in zh ja de pt; do
            echo "Translating → $LOCALE"
            node scripts/ai-translate.mjs --locale "$LOCALE" --all || echo "⚠️ translate $LOCALE failed, continuing"
          done

      # ── Mode: content refresh (Tuesdays) ───────────────────────────────────
      - name: Refresh existing tool tutorials
        if: ${{ steps.vars.outputs.MODE == 'content' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_API_KEY_BACKUP: ${{ secrets.CLAUDE_API_KEY_BACKUP }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_BACKUP: ${{ secrets.OPENAI_API_KEY_BACKUP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER_PRIORITY: ${{ secrets.LLM_PROVIDER_PRIORITY || 'claude,openai,gemini' }}
        run: python scripts/refresh-content.py --limit 5 --delay 1.2 || echo "⚠️ refresh-content.py failed, continuing"

      - name: Generate problem+tool content pages for AI/SEO/Social tools
        if: ${{ steps.vars.outputs.MODE == 'content' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_API_KEY_BACKUP: ${{ secrets.CLAUDE_API_KEY_BACKUP }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_BACKUP: ${{ secrets.OPENAI_API_KEY_BACKUP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER_PRIORITY: ${{ secrets.LLM_PROVIDER_PRIORITY || 'claude,openai,gemini' }}
        run: python scripts/generate-problem-tool-content.py --limit 5 || echo "⚠️ generate-problem-tool-content.py failed, continuing"

      # ── Mode: SEO/GEO refresh (Thursdays) ──────────────────────────────────
      - name: Regenerate llms.txt for AI crawlers
        if: ${{ steps.vars.outputs.MODE == 'seo-geo' }}
        run: python scripts/refresh-llms-txt.py || echo "⚠️ refresh-llms-txt.py failed, continuing"

      # ── Mode: keywords (Saturdays) ────────────────────────────────────────
      - name: Refresh Google Suggest keywords
        if: ${{ steps.vars.outputs.MODE == 'keywords' }}
        run: python scripts/refresh-keywords.py --limit 20 --delay 0.5 || echo "⚠️ refresh-keywords.py failed, continuing"

      # ── Mode: maintenance (Sundays) ───────────────────────────────────────
      - name: Weekly maintenance pass
        if: ${{ steps.vars.outputs.MODE == 'maintenance' }}
        run: python scripts/maintenance.py || echo "⚠️ maintenance.py failed, continuing"

      - name: Generate variants for tools missing them
        if: ${{ steps.vars.outputs.MODE == 'maintenance' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_API_KEY_BACKUP: ${{ secrets.CLAUDE_API_KEY_BACKUP }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_BACKUP: ${{ secrets.OPENAI_API_KEY_BACKUP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER_PRIORITY: ${{ secrets.LLM_PROVIDER_PRIORITY || 'claude,openai,gemini' }}
        run: python scripts/generate-variants.py --limit 20 || echo "⚠️ generate-variants.py failed, continuing"

      - name: Generate programmatic SEO pages
        if: ${{ steps.vars.outputs.MODE == 'maintenance' }}
        run: python scripts/generate-programmatic-seo.py || echo "⚠️ generate-programmatic-seo.py failed, continuing"

      - name: Deep review — analyse existing tools for quality and improvement opportunities
        if: ${{ steps.vars.outputs.MODE == 'maintenance' }}
        run: python scripts/deep-review.py || echo "⚠️ deep-review.py failed, continuing"

      # ── Shared: audit + auto-fix + build + commit ──────────────────────────
      - name: Audit all tools (self-check)
        run: node scripts/audit-tools.mjs || true

      - name: Auto-fix broken tool views
        run: node scripts/fix-broken-tools.mjs || echo "⚠️ fix-broken-tools.mjs failed, continuing"

      - name: Build Next.js site
        run: npm run build

      - name: Commit and push daily update
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ No changes — nothing to commit."
            echo "CHANGED=0" >> "$GITHUB_OUTPUT"
            echo "FILES_CHANGED=0" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git diff --cached --name-only | grep -E "tools-registry|app/blog" | wc -l | tr -d ' ')
            git commit -m "feat(auto-grow): daily update [mode=${{ steps.vars.outputs.MODE }}] +${COUNT} files [skip ci]"
            git pull --rebase
            git push
            echo "CHANGED=1" >> "$GITHUB_OUTPUT"
            echo "FILES_CHANGED=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram daily report
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MODE="${{ steps.vars.outputs.MODE }}"
          CHANGED="${{ steps.commit.outputs.CHANGED }}"
          FILES="${{ steps.commit.outputs.FILES_CHANGED }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          if [ "$CHANGED" = "1" ]; then
            STATUS="✅ 已完成并推送"
            DETAIL="📦 变更文件: ${FILES} 个"
          else
            STATUS="ℹ️ 已运行，无内容变更"
            DETAIL="📦 变更文件: 0 个"
          fi

          MSG=$(printf '🤖 *getfastcalc 每日自动任务汇报*\n━━━━━━━━━━━━━━━━━\n📅 时间: %s\n⚙️ 模式: `%s`\n%s\n%s\n🔗 [查看详细日志](%s)' \
            "$DATE" "$MODE" "$STATUS" "$DETAIL" "$RUN_URL")

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true" \
            --data-urlencode text="${MSG}" || echo "⚠️ Telegram notification failed"
