name: Auto-Grow Tools (Weekly)

on:
  schedule:
    - cron: "0 2 * * 1"   # Every Monday at 02:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI
    inputs:
      category:
        description: "Override category (leave blank for auto-rotation)"
        required: false
        default: ""
      count:
        description: "Number of new tools to generate"
        required: false
        default: "3"

jobs:
  grow:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-select category by week number
        id: pick_category
        run: |
          # Rotate through 12 categories based on ISO week number
          CATEGORIES=(
            "education"
            "home"
            "legal"
            "pet"
            "parenting"
            "math"
            "science"
            "business"
            "language"
            "environment"
            "sports"
            "health"
          )
          WEEK=$(date +%V | sed 's/^0*//')   # ISO week number, strip leading zero
          INDEX=$(( (WEEK - 1) % ${#CATEGORIES[@]} ))
          AUTO_CATEGORY="${CATEGORIES[$INDEX]}"

          # Use manual override if provided
          MANUAL="${{ github.event.inputs.category }}"
          if [ -n "$MANUAL" ]; then
            CATEGORY="$MANUAL"
            echo "Using manual category: $CATEGORY"
          else
            CATEGORY="$AUTO_CATEGORY"
            echo "Week $WEEK → auto-selected category: $CATEGORY"
          fi

          echo "category=$CATEGORY" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install openai requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run research (SerpAPI)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/research.py --category "${{ steps.pick_category.outputs.category }}"

      - name: Generate new tool ideas (OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          COUNT="${{ github.event.inputs.count || '3' }}"
          python scripts/ai_generate.py --category "${{ steps.pick_category.outputs.category }}" --count "$COUNT"

      - name: Generate tool files
        run: python scripts/generate_tool.py

      - name: Build Next.js site
        run: npm run build

      - name: Commit and push new tools
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new tools generated — nothing to commit."
          else
            CATEGORY="${{ steps.pick_category.outputs.category }}"
            COUNT=$(git diff --cached --name-only | grep "tools-registry" | grep "meta.json" | wc -l | tr -d ' ')
            git commit -m "feat(auto-grow): +${COUNT} new ${CATEGORY} tools [skip ci]"
            git push
          fi
